name: Monthly Social Media Report

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month (08:00 GMT+8)
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  generate-report:
    name: Generate Monthly Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monthly report
        run: python main.py --run-once
        env:
          # Meta / Facebook
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          # Instagram
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # TikTok
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ secrets.TIKTOK_ADVERTISER_ID }}
          # LinkedIn
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          # YouTube
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          # Email / SMTP
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          # Google Sheets
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Database (optional – leave unset to use SQLite)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Excel report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-report
          path: reports/*.xlsx
          if-no-files-found: warn

      - name: Upload PDF report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-report
          path: reports/*.pdf
          if-no-files-found: warn

      - name: Upload SQLite database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-db
          path: data/metrics.db
          if-no-files-found: warn
